[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m3_initiative"
version = "0.1.0"
description = "M3 Initiative: A framework for medical text mining, including medication extraction from clinical and biomedical texts"
readme = "README.md"

# TODO: Update authors and emails
# authors = [
#     {name = "HECTA-UoM", email = "your.email@example.com"}
# ]

license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["nlp", "healthcare", "medical-mining", "clinical-text", "biomedical"]
requires-python = ">=3.8"

# TODO: Update dependecies
dependencies = [
  "spacy==3.8.5",
  "spacy-transformers==1.3.8",
  "ollama==0.4.7",
  "pandas==2.2.3",
  "numpy>=1.23.2"
]

[project.urls]
"Homepage" = "https://github.com/HECTA-UoM/M3"
"Bug Tracker" = "https://github.com/HECTA-UoM/M3/issues"
"Documentation" = "https://github.com/HECTA-UoM/M3/wiki"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
per-file-ignores = {}
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

